<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"></head>
<body class="popup">
  <div class="top"><b>Plumbline Brand Guard</b><a href="#" id="opts">Settings</a></div>
  <p id="status" class="muted"></p>
  <select id="platform">
    <option value="instagram">Instagram</option><option value="linkedin">LinkedIn</option><option value="threads">Threads</option>
    <option value="reddit">Reddit</option><option value="whatsapp">WhatsApp</option><option value="discord">Discord</option>
    <option value="bluesky">Bluesky</option><option value="x">X</option><option value="facebook">Facebook</option>
    <option value="youtube">YouTube</option><option value="generic">Other</option>
  </select>
  <textarea id="text" rows="6" placeholder="Paste a draft to check, or click the Plumbline pill inside any composer."></textarea>
  <div class="row"><button id="check" class="p">Check</button><button id="rewrite">Rewrite on-brand</button></div>
  <div id="out"></div>
  <script type="module" src="popup.js"></script>
</body></html>
